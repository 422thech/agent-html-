    <g transform="translate(1157 93)" fill="none" stroke="#79917c" opacity=".85"><circle r="38" stroke-width="1"/><circle r="32" stroke-width=".7" stroke-dasharray="1 4"/><path d="m0-19 4 15 15 4-15 4-4 15-4-15-15-4 15-4Z" stroke-width="1.2"/><path d="m0-12 3 12-3 12-3-12Z" fill="#8fa58a" stroke="none"/><text y="-47" text-anchor="middle" fill="#79917c" stroke="none" font-size="9" font-family="Georgia,serif">N</text></g>
    <g fill="#7f8d71" font-family="'Segoe UI',sans-serif" font-size="10" letter-spacing="2.5"><text x="83" y="872">COASTAL ROUTE — 08:24 AM</text><text x="1317" y="872" text-anchor="end">TAKE THE SCENIC WAY HOME.</text></g>
    <rect width="1400" height="920" fill="url(#grain)" pointer-events="none"/>
  </svg>
  </div>
  <footer><div class="caption">顺风，慢行。<small>把日子，骑成一阵海风。</small></div><div class="controls"><span class="status" id="status">海岸骑行中</span><button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true" id="buttonIcon"><path d="M3 2v8M9 2v8" stroke="currentColor" stroke-width="2"/></svg><span id="buttonLabel">暂停</span></button></div></footer>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches, elapsed = 0, lastTime = null, frameId = null;
  const cycle = Math.PI * 2;
  const nodes = Object.fromEntries(['rearWheel','frontWheel','crank','rider','scarfTail','eye','birds','waves','clouds','roadmarks','groundPlants','legCuff','farLegPath','farLegHighlight','farFoot','nearLegPath','nearLegHighlight','nearFoot','knee'].map(id => [id,$(id)]));
  function leg(side, hipX, hipY, phase) {
    const footX = 674 + Math.cos(phase) * 49;
    // The ankle sits above the pedal, including the webbed foot's thickness.
    const footY = 652 + Math.sin(phase) * 49 - (side === 'near' ? 16 : 12);
    const dx = footX - hipX, dy = footY - hipY, d = Math.hypot(dx,dy);
    const upper = 122, lower = 127;
    const along = (upper*upper - lower*lower + d*d)/(2*d);
    const height = Math.sqrt(Math.max(0,upper*upper-along*along));
    const kneeX = hipX + along*dx/d + height*dy/d;
    const kneeY = hipY + along*dy/d - height*dx/d;
    const path = `M${hipX.toFixed(2)} ${hipY.toFixed(2)} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${footX.toFixed(2)} ${footY.toFixed(2)}`;
    nodes[side+'LegPath'].setAttribute('d',path);
    nodes[side+'LegHighlight'].setAttribute('d',path);
    nodes[side+'Foot'].setAttribute('transform',`translate(${footX} ${footY})`);
    if(side==='near'){nodes.knee.setAttribute('cx',kneeX);nodes.knee.setAttribute('cy',kneeY);}
  }
  function render(t) {
    const phase = t * cycle / 2.8;
    const bob = Math.sin(phase*2)*2.2;
    nodes.rearWheel.setAttribute('transform',`rotate(${phase*180/Math.PI*1.55})`);
    nodes.frontWheel.setAttribute('transform',`rotate(${phase*180/Math.PI*1.55})`);
    nodes.crank.setAttribute('transform',`translate(674 652) rotate(${phase*180/Math.PI})`);
    nodes.rider.setAttribute('transform',`translate(0 ${bob})`);
    nodes.legCuff.setAttribute('transform',`translate(0 ${bob})`);
    nodes.scarfTail.setAttribute('transform',`rotate(${Math.sin(t*4)*2.5} 718 337)`);
    const blinkAt = t%5.6, eyeScale = blinkAt>5.35 ? .12+.88*Math.abs((blinkAt-5.475)/.125) : 1;
    nodes.eye.setAttribute('transform',`translate(0 ${235*(1-eyeScale)}) scale(1 ${eyeScale})`);
    nodes.birds.setAttribute('transform',`translate(${Math.sin(t*.32)*25} ${Math.sin(t*.9)*5})`);
    nodes.clouds.setAttribute('transform',`translate(${Math.sin(t*.08)*28} 0)`);
    nodes.waves.setAttribute('transform',`translate(${Math.sin(t*.3)*24} ${Math.sin(t)*1.5})`);
    nodes.roadmarks.setAttribute('transform',`translate(${-((t*100)%1500)})`);
    nodes.groundPlants.setAttribute('transform',`translate(${-((t*34)%1500)})`);
    leg('far',657,462+bob,phase+Math.PI);
    leg('near',670,477+bob,phase);
  }
  // Repeat scenery across the canvas so each pass loops without a visible jump.
  for(const id of ['roadmarks','groundPlants']){
    const group=nodes[id], original=document.createElementNS('http://www.w3.org/2000/svg','g');
    while(group.firstChild) original.appendChild(group.firstChild);
    group.appendChild(original);
    const clone=original.cloneNode(true);
    clone.setAttribute('transform','translate(1500 0)');
    group.appendChild(clone);
  }
  function tick(now){
    frameId=null;
    if(!playing || document.hidden){lastTime=null;return;}
    if(lastTime!==null) elapsed+=Math.min((now-lastTime)/1000,.06);
    lastTime=now;render(elapsed);frameId=requestAnimationFrame(tick);
  }
  function update(){
    $('buttonLabel').textContent=playing?'暂停':'播放';
    $('toggle').setAttribute('aria-label',playing?'暂停动画':'播放动画');
    $('toggle').setAttribute('aria-pressed',String(!playing));
    $('status').textContent=playing?'海岸骑行中':'停下来，听听海';
    $('buttonIcon').innerHTML=playing?'<path d="M3 2v8M9 2v8" stroke="currentColor" stroke-width="2"/>':'<path d="m3 1 8 5-8 5Z" fill="currentColor"/>';
    if(frameId!==null)cancelAnimationFrame(frameId);
    frameId=null;lastTime=null;
    if(playing&&!document.hidden)frameId=requestAnimationFrame(tick);
  }
  $('toggle').addEventListener('click',()=>{playing=!playing;update();});
  reducedMotion.addEventListener('change',event=>{playing=!event.matches;update();});
  document.addEventListener('visibilitychange',update);
  render(0);update();
})();
</script>
</body>
</html>
